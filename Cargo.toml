[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.85 is the floor the dependency tree sets, not a preference: crates in
# it now use edition 2024, which older Cargo cannot even parse.
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["CheapAzHobbies"]
repository = "https://github.com/CheapAzHobbies/CheapAzPrintingSLA"
homepage = "https://github.com/CheapAzHobbies/CheapAzPrintingSLA"

[workspace.dependencies]
cheapazsla-core = { path = "crates/core", version = "0.1.0" }
thiserror = "2"
log = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
